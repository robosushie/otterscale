name: CI Go

on:
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: test vet build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Test
        run: go test ./packages/core/... ./packages/edge/...

      - name: Vet
        run: go vet ./packages/core/... ./packages/edge/...

      - name: Build
        run: |
          go build -o /tmp/core ./packages/core/cmd/core
          go build -o /tmp/proxy ./packages/edge/cmd/proxy
