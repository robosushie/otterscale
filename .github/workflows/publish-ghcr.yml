name: Publish GHCR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (for example 0.1.0 or dev)
        required: true
        type: string

jobs:
  publish:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: deployment/app/Dockerfile
            context: .
          - name: core
            file: deployment/core/Dockerfile
            context: .
          - name: edge
            file: deployment/edge/Dockerfile
            context: .
          - name: headscale
            file: deployment/headscale/Dockerfile
            context: deployment/headscale
          - name: standalone
            file: deployment/standalone/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          TAG="${TAG#v}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Tag must be letters, numbers, dots, underscores, or hyphens" >&2
            exit 1
          fi
          SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          IMAGE="ghcr.io/${{ github.repository }}/${{ matrix.name }}"
          IMAGE="${IMAGE,,}"
          # Pushing an existing tag moves it onto this digest.
          TAGS="${IMAGE}:${TAG},${IMAGE}:${TAG}-${SHA}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "package=${{ github.event.repository.name }}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          package="$(printf '%s' "$PACKAGE" | tr '[:upper:]' '[:lower:]')"
          # Keep the slash as %2F. A decoded slash is a different route and 404s.
          encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$package")"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            base="https://api.github.com/orgs/${OWNER}/packages/container/${encoded}"
          else
            base="https://api.github.com/user/packages/container/${encoded}"
          fi
          # GitHub has no REST route that changes container visibility.
          # The old visibility update returns 404 even when this GET finds the package.
          # Set it once in Package settings. That choice then sticks.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/ghcr-package.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${base}")"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            echo "package lookup HTTP ${code} (attempt ${attempt})"
            cat /tmp/ghcr-package.json
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "Pushed ${package} but GitHub has not listed the package yet" >&2
            exit 1
          fi
          if grep -q '"visibility":"public"' /tmp/ghcr-package.json; then
            echo "Package ${package} is public"
            exit 0
          fi
          echo "::warning::${package} is private. GitHub does not let Actions change this. Open Package settings and set visibility to Public once: https://github.com/${REPOSITORY}/pkgs/container/${encoded}/settings"

  site:
    name: Record tag and deploy Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Update site/releases.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          TAG="${TAG#v}"
          SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          current="$(jq -r '.latest // empty' site/releases.json)"
          if [ "$current" = "$TAG" ]; then
            jq --arg tag "$TAG" --arg sha "$SHA" --arg prefix "$PREFIX" \
              '.latest = $tag | .sha = $sha | .prefix = $prefix' \
              site/releases.json > site/releases.json.tmp
          else
            jq --arg tag "$TAG" --arg sha "$SHA" --arg prefix "$PREFIX" --arg prev "$current" \
              '.previous = (if $prev == "" then .previous else $prev end) | .history = (if $prev == "" then (.history // []) else ([$prev] + ((.history // []) | map(select(. != $prev and . != $tag)))) end) | .latest = $tag | .sha = $sha | .prefix = $prefix' \
              site/releases.json > site/releases.json.tmp
          fi
          mv site/releases.json.tmp site/releases.json

      - name: Copy pull files
        run: |
          mkdir -p site/assets
          cp deployment/otterscale-standalone.yaml site/assets/otterscale-standalone.yaml
          cp deployment/otterscale-standalone.env.example site/assets/otterscale-standalone.env.example
          cp deployment/otterscale-stack.yaml site/assets/otterscale-stack.yaml
          cp deployment/otterscale-stack.env.example site/assets/otterscale-stack.env.example

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Open pull request for published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/releases.json
          if git diff --cached --quiet; then
            echo "releases.json unchanged"
            exit 0
          fi
          # main rejects a direct push. Record the tag on a branch and open a pull request.
          branch="chore/record-ghcr-${TAG}"
          subject="chore(site): record GHCR tag ${TAG}"
          if [ "${#subject}" -gt 81 ]; then
            subject="chore(site): record published GHCR tag"
          fi
          git checkout -B "$branch"
          git commit -m "$subject"
          git push --force origin "HEAD:${branch}"
          existing="$(gh pr list --head "$branch" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr view "$existing" --json url --jq .url
            exit 0
          fi
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "$subject" \
            --body "Published images for \`${TAG}\` are already on GHCR. Merge this so \`site/releases.json\` matches that tag."
