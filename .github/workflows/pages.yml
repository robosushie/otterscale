name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "deploy/otterscale-stack.yaml"
      - "deploy/otterscale-stack.env.example"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy Otterscale Stack assets
        run: |
          mkdir -p site/assets
          cp deploy/otterscale-stack.yaml site/assets/otterscale-stack.yaml
          cp deploy/otterscale-stack.env.example site/assets/otterscale-stack.env.example

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
