name: CI console

on:
  pull_request:
  workflow_dispatch:

jobs:
  console:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm --filter @otterscale/app exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
