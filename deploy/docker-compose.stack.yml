# Bundled Postgres for one-command deploy (pnpm deploy:stack). Merge with docker-compose.yml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: otterscale
      POSTGRES_PASSWORD: otterscale
      POSTGRES_DB: otterscale
    volumes:
      - otterscale_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otterscale -d otterscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    depends_on:
      postgres:
        condition: service_healthy
      headscale:
        condition: service_started

volumes:
  otterscale_pg:
