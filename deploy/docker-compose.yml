# Console + Headscale behind edge (Caddy TLS + Go tsnet).
# SQLite for the Next.js app lives on the otterscale_data volume.
# The init container mints Headscale keys onto otterscale_secrets. Do not put
# HEADSCALE_API_KEY or APPS_EDGE_AUTHKEY in .env — those belong to this volume.
# edge joins Headscale as hostname edge / tag:edge and reverse-proxies published apps.
name: otterscale

services:
  headscale:
    build:
      context: ./headscale
      dockerfile: Dockerfile
    image: otterscale-headscale:local
    container_name: headscale
    hostname: headscale
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OTTERSCALE_DOMAIN: ${OTTERSCALE_DOMAIN:-}
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - headscale_data:/var/lib/headscale
      - headscale_run:/var/run/headscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  init:
    build:
      context: ./headscale
      dockerfile: Dockerfile
    image: otterscale-headscale:local
    container_name: otterscale-init
    hostname: init
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random string of at least 32 characters}
      HEADSCALE_USER: tagged-devices
      HEADSCALE_INTERNAL_URL: http://headscale:8080
    volumes:
      - headscale_run:/var/run/headscale
      - otterscale_secrets:/otterscale-secrets
    entrypoint: ["/bootstrap.sh"]
    restart: on-failure
    depends_on:
      headscale:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: app
    hostname: app
    env_file:
      - ../.env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: file:/data/otterscale.db
      AUTH_URL: ${AUTH_URL:-https://console.localhost}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random string of at least 32 characters}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
      HEADSCALE_INTERNAL_URL: http://headscale:8080
      HEADSCALE_PUBLIC_URL: ${HEADSCALE_PUBLIC_URL:-https://hs.localhost}
      OTTERSCALE_DOMAIN: ${OTTERSCALE_DOMAIN:-}
      HEADSCALE_API_KEY: ""
      APPS_BASE_DOMAIN: ${APPS_BASE_DOMAIN:-apps.localhost}
      APPS_ROUTES_PATH: /data/apps-caddy/routes.json
      APPS_PROBE_URL: http://edge:4180
    volumes:
      - otterscale_data:/data
      - apps_caddy_config:/data/apps-caddy
      - otterscale_secrets:/otterscale-secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  edge:
    build:
      context: ..
      dockerfile: deploy/edge/Dockerfile
    container_name: edge
    hostname: edge
    ports:
      - "80:80"
      - "443:443"
    environment:
      HEADSCALE_INTERNAL_URL: http://headscale:8080
      APPS_EDGE_AUTHKEY: ""
      APPS_ROUTES_PATH: /data/apps-caddy/routes.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: edge
      LISTEN_ADDR: 127.0.0.1:8081
      PROBE_ADDR: :4180
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - apps_proxy_state:/var/lib/tailscale
      - apps_caddy_config:/data/apps-caddy
      - otterscale_secrets:/otterscale-secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4180/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  headscale_data:
  headscale_run:
  otterscale_data:
  otterscale_secrets:
  caddy_data:
  caddy_config:
  apps_caddy_config:
  apps_proxy_state:
