# One container: Caddy + Headscale + console + tsnet.
# Does not share a Compose project with deploy/docker-compose.yml.
#
#   pnpm deploy:standalone
#   docker compose -p otterscale-standalone -f deploy/docker-compose.standalone.yml up -d
name: otterscale-standalone

services:
  standalone:
    build:
      context: ..
      dockerfile: deploy/standalone/Dockerfile
    container_name: otterscale-standalone
    hostname: otterscale
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:18080"
    env_file:
      - ../.env
    environment:
      HOSTNAME: "127.0.0.1"
      DATABASE_URL: file:/data/otterscale.db
      AUTH_URL: ${AUTH_URL:-https://console.localhost}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random string of at least 32 characters}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_SETUP_TOKEN: ${AUTH_SETUP_TOKEN:-}
      HEADSCALE_INTERNAL_URL: http://127.0.0.1:18080
      HEADSCALE_PUBLIC_URL: ${HEADSCALE_PUBLIC_URL:-https://hs.localhost}
      OTTERSCALE_DOMAIN: ${OTTERSCALE_DOMAIN:-}
      HEADSCALE_API_KEY: ""
      APPS_BASE_DOMAIN: ${APPS_BASE_DOMAIN:-apps.localhost}
      APPS_ROUTES_PATH: /data/apps-caddy/routes.json
      APPS_PROBE_URL: http://127.0.0.1:4180
      APPS_EDGE_AUTHKEY: ""
      TS_STATE_DIR: /data/tailscale
      TS_HOSTNAME: edge
      LISTEN_ADDR: 127.0.0.1:8081
      PROBE_ADDR: :4180
      CONSOLE_HOST: ${CONSOLE_HOST:-console.localhost}
      HS_HOST: ${HS_HOST:-hs.localhost}
      OTTERSCALE_SECRETS_DIR: /data/secrets
    volumes:
      - otterscale_standalone_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4180/healthz"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s

volumes:
  otterscale_standalone_data:
